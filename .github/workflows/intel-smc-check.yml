# SMC (Intel sıcaklık) yolunu gerçek Intel donanımında sınar.
#
# Neden bir sanal makine değil de bu: SMC fiziksel bir yonga, sanallaştırma
# yazılımları misafir işletim sistemine onu hiç sunmuyor. VM'de "çalışıyor"
# görmek hiçbir şey kanıtlamaz.
#
# macos-13 çalıştırıcıları GitHub'ın kendi barındırdığı GERÇEK Intel Mac
# donanımı (sanal değil). SicaklikSMC.swift kaynak dosyasında "gerçek
# donanımda test edilemedi" notu vardı — bu iş akışı elimizde Intel Mac
# olmadan o notu doğrulamanın/çürütmenin tek yolu.
#
# sensor-probe ve macstats-cli üretimdeki aynı kodu çağırıyor: IOHID hiçbir
# şey bulamazsa otomatik SMC'ye düşüyorlar (bkz. Sicaklik.swift, smcdenOku).
# Yani burada özel bir "Intel modu" test edilmiyor, kullanıcının Intel Mac'te
# göreceği yolun ta kendisi çalıştırılıyor.
#
# Elle tetiklenir (Actions sekmesi -> bu iş akışı -> Run workflow); her push'ta
# otomatik çalışmıyor çünkü macOS dakikaları normal Linux'a göre 10 kat
# pahalıya sayılıyor.

name: Intel SMC kontrolü

on:
  workflow_dispatch: {}

jobs:
  intel-donanımda-oku:
    # macos-13: GitHub'ın son Intel (x86_64) macOS çalıştırıcısı. macos-14 ve
    # sonrası Apple Silicon'a geçti; SMC testi için özellikle bunu istiyoruz.
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Donanımı doğrula (gerçekten Intel mi?)
        run: |
          echo "Mimari: $(uname -m)"
          sysctl -n machdep.cpu.brand_string
          system_profiler SPHardwareDataType | grep -E "Model Name|Chip|Processor"
          # "arm64" çıkarsa bu iş akışı yanlış donanımda çalışmış demektir.
          [ "$(uname -m)" = "x86_64" ] || { echo "HATA: Intel değil, arm64!"; exit 1; }

      - name: Derle
        run: swift build

      - name: Saf mantık testleri
        run: swift test

      - name: SMC yolunu çalıştır (sensor-probe)
        run: |
          echo "=== sensor-probe (hepsiniOku: true) ==="
          ./.build/debug/sensor-probe || echo "(çıkış kodu sıfır değil — ayrıca bak)"

      - name: Uygulamanın kullandığı yolu çalıştır (macstats-cli)
        run: |
          echo "=== macstats-cli — üretimde çağrılan kod ==="
          ./.build/debug/macstats-cli 3
